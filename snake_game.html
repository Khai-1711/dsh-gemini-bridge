<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberpunk Neon Snake Arcade</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #05050a;
            background-image: 
                radial-gradient(circle at 50% 50%, #1a0b2e 0%, #05050a 100%),
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 100%, 100% 4px, 6px 100%;
            font-family: 'Orbitron', sans-serif;
            color: #00f0ff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            padding: 10px;
        }

        .arcade-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(10, 10, 25, 0.85);
            border: 2px solid #00f0ff;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.4), inset 0 0 15px rgba(0, 240, 255, 0.2);
            border-radius: 12px;
            padding: 20px;
            max-width: 460px;
            width: 100%;
            position: relative;
        }

        .arcade-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 15px;
            border-bottom: 1px dashed rgba(0, 240, 255, 0.3);
            padding-bottom: 10px;
        }

        .title {
            font-size: 1.2rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: #ff007f;
            text-shadow: 0 0 10px rgba(255, 0, 127, 0.7);
        }

        .controls-top {
            display: flex;
            gap: 10px;
        }

        .arcade-btn {
            background: transparent;
            border: 1px solid #00f0ff;
            color: #00f0ff;
            padding: 6px 12px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s ease;
            text-shadow: 0 0 5px rgba(0, 240, 255, 0.5);
            box-shadow: 0 0 5px rgba(0, 240, 255, 0.2);
        }

        .arcade-btn:hover {
            background: #00f0ff;
            color: #05050a;
            box-shadow: 0 0 15px #00f0ff;
        }

        .score-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 100%;
            margin-bottom: 15px;
        }

        .score-box {
            background: rgba(0, 240, 255, 0.05);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 6px;
            padding: 8px;
            text-align: center;
        }

        .score-label {
            font-size: 0.65rem;
            color: #a0a0c0;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .score-value {
            font-size: 1rem;
            font-weight: 700;
            color: #39ff14;
            text-shadow: 0 0 8px rgba(57, 255, 20, 0.6);
        }

        .canvas-wrapper {
            position: relative;
            width: 400px;
            height: 400px;
            border: 2px solid #ff007f;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.5);
            border-radius: 4px;
            overflow: hidden;
            background: #080812;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 10, 0.85);
            backdrop-filter: blur(3px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: opacity 0.3s ease;
        }

        .overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .overlay-title {
            font-size: 1.8rem;
            font-weight: 900;
            color: #ff007f;
            text-shadow: 0 0 15px rgba(255, 0, 127, 0.8);
            margin-bottom: 10px;
            text-align: center;
            letter-spacing: 2px;
        }

        .overlay-sub {
            font-size: 0.8rem;
            color: #00f0ff;
            margin-bottom: 25px;
            text-align: center;
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.5);
        }

        .main-btn {
            background: linear-gradient(45deg, #ff007f, #7f00ff);
            border: none;
            color: #ffffff;
            padding: 12px 30px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            font-weight: 950;
            cursor: pointer;
            border-radius: 6px;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.6);
            transition: all 0.2s ease;
            letter-spacing: 1px;
        }

        .main-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.9);
        }

        /* D-Pad for Mobile */
        .dpad-container {
            display: none;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(2, 60px);
            gap: 10px;
            margin-top: 20px;
            justify-content: center;
        }

        .dpad-btn {
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid #00f0ff;
            color: #00f0ff;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(0, 240, 255, 0.2);
            transition: background 0.1s;
        }

        .dpad-btn:active {
            background: #00f0ff;
            color: #05050a;
            box-shadow: 0 0 15px #00f0ff;
        }

        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }

        .instructions {
            margin-top: 15px;
            font-size: 0.65rem;
            color: #8080a0;
            text-align: center;
            line-height: 1.4;
        }

        @media (max-width: 480px) {
            .canvas-wrapper {
                width: 320px;
                height: 320px;
            }
            .arcade-container {
                padding: 10px;
            }
            .dpad-container {
                display: grid;
            }
        }
    </style>
</head>
<body>

    <div class="arcade-container">
        <div class="arcade-header">
            <div class="title">NEON SNAKE</div>
            <div class="controls-top">
                <button id="mute-btn" class="arcade-btn">AUDIO: ON</button>
                <button id="restart-btn" class="arcade-btn">RESET</button>
            </div>
        </div>

        <div class="score-board">
            <div class="score-box">
                <div class="score-label">Score</div>
                <div id="score-val" class="score-value">0</div>
            </div>
            <div class="score-box">
                <div class="score-label">High Score</div>
                <div id="highscore-val" class="score-value">0</div>
            </div>
            <div class="score-box">
                <div class="score-label">Level</div>
                <div id="level-val" class="score-value">1</div>
            </div>
        </div>

        <div class="canvas-wrapper">
            <canvas id="gameCanvas" width="400" height="400"></canvas>

            <!-- Overlays -->
            <div id="start-overlay" class="overlay">
                <div class="overlay-title">CYBER SNAKE</div>
                <div class="overlay-sub">Sẵn sàng bước vào lưới Neon?</div>
                <button id="start-btn" class="main-btn">BẮT ĐẦU</button>
            </div>

            <div id="pause-overlay" class="overlay hidden">
                <div class="overlay-title">PAUSED</div>
                <div class="overlay-sub">Hệ thống đang tạm dừng</div>
                <button id="resume-btn" class="main-btn">TIẾP TỤC</button>
            </div>

            <div id="gameover-overlay" class="overlay hidden">
                <div class="overlay-title" style="color: #ff3333; text-shadow: 0 0 15px rgba(255,51,51,0.8);">GAME OVER</div>
                <div id="final-score-sub" class="overlay-sub">Điểm số: 0</div>
                <button id="retry-btn" class="main-btn">CHƠI LẠI</button>
            </div>
        </div>

        <!-- D-Pad cho Mobile / Tablet -->
        <div class="dpad-container">
            <button class="dpad-btn btn-up" data-dir="up">▲</button>
            <button class="dpad-btn btn-left" data-dir="left">◀</button>
            <button class="dpad-btn btn-down" data-dir="down">▼</button>
            <button class="dpad-btn btn-right" data-dir="right">▶</button>
        </div>

        <div class="instructions">
            Phím: Mũi tên / WASD để di chuyển | Space: Tạm dừng | R: Chơi lại
        </div>
    </div>

    <script>
        // --- Web Audio Synthesizer ---
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.muted = false;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playEatNormal() {
                if (this.muted) return;
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, this.ctx.currentTime + 0.1);
                
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.1);
            }

            playEatGolden() {
                if (this.muted) return;
                this.init();
                // Hợp âm arpeggio tươi sáng
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, index) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime + index * 0.05);

                    gain.gain.setValueAtTime(0.2, this.ctx.currentTime + index * 0.05);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + index * 0.05 + 0.15);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(this.ctx.currentTime + index * 0.05);
                    osc.stop(this.ctx.currentTime + index * 0.05 + 0.15);
                });
            }

            playGameOver() {
                if (this.muted) return;
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(60, this.ctx.currentTime + 0.5);

                gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.5);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.5);
            }

            playPause() {
                if (this.muted) return;
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(300, this.ctx.currentTime);
                osc.frequency.setValueAtTime(150, this.ctx.currentTime + 0.08);

                gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.15);
            }

            toggleMute() {
                this.muted = !this.muted;
                return this.muted;
            }
        }

        // --- Class SnakeEngine (AI 1) ---
        class SnakeEngine {
            constructor() {
                this.gridSize = 20;
                this.highScore = parseInt(localStorage.getItem('snake_highscore')) || 0;
                this.reset();
            }

            reset() {
                this.snake = [
                    { x: 5, y: 10 },
                    { x: 4, y: 10 },
                    { x: 3, y: 10 }
                ];
                this.direction = { x: 1, y: 0 };
                this.nextDirection = { x: 1, y: 0 };
                this.score = 0;
                this.level = 1;
                this.state = 'ready'; // 'ready', 'playing', 'paused', 'gameover'
                this.food = this.spawnFood();
                this.goldenFood = null;
                this.goldenFoodTimer = 0;
                this.goldenFoodCounter = 0;
            }

            togglePause() {
                if (this.state === 'playing') {
                    this.state = 'paused';
                } else if (this.state === 'paused') {
                    this.state = 'playing';
                }
            }

            setDirection(dx, dy) {
                if (this.state === 'ready') {
                    this.state = 'playing';
                }
                if (this.state !== 'playing') return;

                // Prevent 180-degree turn instantly
                if (this.direction.x + dx === 0 && this.direction.y + dy === 0) {
                    return;
                }
                this.nextDirection = { x: dx, y: dy };
            }

            spawnFood() {
                let newFood;
                while (true) {
                    newFood = {
                        x: Math.floor(Math.random() * this.gridSize),
                        y: Math.floor(Math.random() * this.gridSize)
                    };
                    const onSnake = this.snake.some(segment => segment.x === newFood.x && segment.y === newFood.y);
                    const onGolden = this.goldenFood && this.goldenFood.x === newFood.x && this.goldenFood.y === newFood.y;
                    if (!onSnake && !onGolden) break;
                }
                return newFood;
            }

            spawnGoldenFood() {
                if (this.goldenFood) return;
                let newFood;
                while (true) {
                    newFood = {
                        x: Math.floor(Math.random() * this.gridSize),
                        y: Math.floor(Math.random() * this.gridSize)
                    };
                    const onSnake = this.snake.some(segment => segment.x === newFood.x && segment.y === newFood.y);
                    const onFood = this.food.x === newFood.x && this.food.y === newFood.y;
                    if (!onSnake && !onFood) break;
                }
                this.goldenFood = newFood;
                this.goldenFoodTimer = 40; // Tồn tại trong 40 ticks
            }

            update() {
                if (this.state !== 'playing') {
                    return { ateNormal: false, ateGolden: false, gameOver: false };
                }

                this.direction = this.nextDirection;

                const head = {
                    x: this.snake[0].x + this.direction.x,
                    y: this.snake[0].y + this.direction.y
                };

                // Kiểm tra đâm tường
                if (head.x < 0 || head.x >= this.gridSize || head.y < 0 || head.y >= this.gridSize) {
                    this.setGameOver();
                    return { ateNormal: false, ateGolden: false, gameOver: true };
                }

                // Kiểm tra tự cắn
                if (this.snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                    this.setGameOver();
                    return { ateNormal: false, ateGolden: false, gameOver: true };
                }

                this.snake.unshift(head);

                let ateNormal = false;
                let ateGolden = false;

                // Kiểm tra ăn mồi thường
                if (head.x === this.food.x && head.y === this.food.y) {
                    ateNormal = true;
                    this.score += 10;
                    this.food = this.spawnFood();
                    this.checkLevelUp();
                } 
                // Kiểm tra ăn mồi vàng
                else if (this.goldenFood && head.x === this.goldenFood.x && head.y === this.goldenFood.y) {
                    ateGolden = true;
                    this.score += 50;
                    this.goldenFood = null;
                    this.goldenFoodTimer = 0;
                    this.checkLevelUp();
                } else {
                    this.snake.pop();
                }

                // Xử lý đếm ngược mồi vàng
                if (this.goldenFood) {
                    this.goldenFoodTimer--;
                    if (this.goldenFoodTimer <= 0) {
                        this.goldenFood = null;
                    }
                } else {
                    this.goldenFoodCounter++;
                    if (this.goldenFoodCounter >= 35) { // Tỉ lệ xuất hiện mồi vàng
                        this.goldenFoodCounter = 0;
                        if (Math.random() < 0.6) {
                            this.spawnGoldenFood();
                        }
                    }
                }

                return { ateNormal, ateGolden, gameOver: false };
            }

            checkLevelUp() {
                this.level = Math.floor(this.score / 100) + 1;
            }

            setGameOver() {
                this.state = 'gameover';
                if (this.score > this.highScore) {
                    this.highScore = this.score;
                    localStorage.setItem('snake_highscore', this.highScore);
                }
            }
        }

        // --- Frontend & Game Art Controller ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const soundEngine = new SoundEngine();
        const engine = new SnakeEngine();

        // DOM Elements
        const scoreValEl = document.getElementById('score-val');
        const highscoreValEl = document.getElementById('highscore-val');
        const levelValEl = document.getElementById('level-val');
        const startOverlay = document.getElementById('start-overlay');
        const pauseOverlay = document.getElementById('pause-overlay');
        const gameoverOverlay = document.getElementById('gameover-overlay');
        const finalScoreSub = document.getElementById('final-score-sub');
        const startBtn = document.getElementById('start-btn');
        const resumeBtn = document.getElementById('resume-btn');
        const retryBtn = document.getElementById('retry-btn');
        const restartBtn = document.getElementById('restart-btn');
        const muteBtn = document.getElementById('mute-btn');

        let particles = [];

        // Hiệu ứng hạt nổ (Particle Explosion)
        function createParticles(x, y, color) {
            const pixelSize = canvas.width / engine.gridSize;
            const px = (x + 0.5) * pixelSize;
            const py = (y + 0.5) * pixelSize;
            for (let i = 0; i < 15; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 3 + 1;
                particles.push({
                    x: px,
                    y: py,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    alpha: 1.0,
                    color: color,
                    size: Math.random() * 3 + 2
                });
            }
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.03;
                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        function drawParticles() {
            ctx.save();
            particles.forEach(p => {
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.shadowColor = p.color;
                ctx.shadowBlur = 8;
                ctx.fillRect(p.x, p.y, p.size, p.size);
            });
            ctx.restore();
        }

        // Render Canvas & Cyberpunk Game Art
        function render() {
            const tileSize = canvas.width / engine.gridSize;

            // Clear background
            ctx.fillStyle = '#05050a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Vẽ lưới neon mờ
            ctx.strokeStyle = 'rgba(0, 240, 255, 0.03)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= engine.gridSize; i++) {
                ctx.beginPath();
                ctx.moveTo(i * tileSize, 0);
                ctx.lineTo(i * tileSize, canvas.height);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, i * tileSize);
                ctx.lineTo(canvas.width, i * tileSize);
                ctx.stroke();
            }

            // Vẽ mồi thường (Neon Green)
            if (engine.food) {
                ctx.save();
                ctx.fillStyle = '#39ff14';
                ctx.shadowColor = '#39ff14';
                ctx.shadowBlur = 12;
                const fx = engine.food.x * tileSize + tileSize / 2;
                const fy = engine.food.y * tileSize + tileSize / 2;
                ctx.beginPath();
                ctx.arc(fx, fy, tileSize * 0.35, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            // Vẽ mồi vàng (Neon Yellow + Timer Bar)
            if (engine.goldenFood) {
                ctx.save();
                ctx.fillStyle = '#ffcc00';
                ctx.shadowColor = '#ffcc00';
                ctx.shadowBlur = 15;
                const gx = engine.goldenFood.x * tileSize + tileSize / 2;
                const gy = engine.goldenFood.y * tileSize + tileSize / 2;
                ctx.beginPath();
                ctx.arc(gx, gy, tileSize * 0.4, 0, Math.PI * 2);
                ctx.fill();

                // Thanh đếm ngược thời gian nhỏ bên trên mồi vàng
                const percent = engine.goldenFoodTimer / 40;
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.fillRect(engine.goldenFood.x * tileSize + 2, engine.goldenFood.y * tileSize - 5, (tileSize - 4) * percent, 3);
                ctx.restore();
            }

            // Vẽ rắn (Gradient thân + Đầu phát sáng có mắt)
            engine.snake.forEach((seg, index) => {
                ctx.save();
                const x = seg.x * tileSize;
                const y = seg.y * tileSize;

                if (index === 0) {
                    // Đầu rắn
                    ctx.fillStyle = '#00f0ff';
                    ctx.shadowColor = '#00f0ff';
                    ctx.shadowBlur = 15;
                    ctx.fillRect(x + 1, y + 1, tileSize - 2, tileSize - 2);

                    // Mắt rắn dựa vào hướng đi
                    ctx.fillStyle = '#05050a';
                    let eye1x = x + tileSize * 0.3, eye1y = y + tileSize * 0.3;
                    let eye2x = x + tileSize * 0.7, eye2y = y + tileSize * 0.7;

                    if (engine.direction.x === 1) { eye1x = x + tileSize * 0.7; eye1y = y + tileSize * 0.25; eye2x = x + tileSize * 0.7; eye2y = y + tileSize * 0.75; }
                    else if (engine.direction.x === -1) { eye1x = x + tileSize * 0.3; eye1y = y + tileSize * 0.25; eye2x = x + tileSize * 0.3; eye2y = y + tileSize * 0.75; }
                    else if (engine.direction.y === 1) { eye1x = x + tileSize * 0.25; eye1y = y + tileSize * 0.7; eye2x = x + tileSize * 0.75; eye2y = y + tileSize * 0.7; }
                    else if (engine.direction.y === -1) { eye1x = x + tileSize * 0.25; eye1y = y + tileSize * 0.3; eye2x = x + tileSize * 0.75; eye2y = y + tileSize * 0.3; }

                    ctx.fillRect(eye1x - 1.5, eye1y - 1.5, 3, 3);
                    ctx.fillRect(eye2x - 1.5, eye2y - 1.5, 3, 3);
                } else {
                    // Thân rắn gradient mờ dần
                    const ratio = 1 - (index / engine.snake.length);
                    ctx.fillStyle = `rgba(0, 150, 255, ${Math.max(0.3, ratio)})`;
                    ctx.shadowColor = '#00f0ff';
                    ctx.shadowBlur = 5;
                    ctx.fillRect(x + 2, y + 2, tileSize - 4, tileSize - 4);
                }
                ctx.restore();
            });

            // Vẽ hiệu ứng hạt
            drawParticles();
        }

        // Cập nhật UI Scoreboard và Overlay
        function updateUI() {
            scoreValEl.innerText = engine.score;
            highscoreValEl.innerText = engine.highScore;
            levelValEl.innerText = engine.level;

            // Quản lý trạng thái hiển thị Overlay
            if (engine.state === 'ready') {
                startOverlay.classList.remove('hidden');
                pauseOverlay.classList.add('hidden');
                gameoverOverlay.classList.add('hidden');
            } else if (engine.state === 'playing') {
                startOverlay.classList.add('hidden');
                pauseOverlay.classList.add('hidden');
                gameoverOverlay.classList.add('hidden');
            } else if (engine.state === 'paused') {
                pauseOverlay.classList.remove('hidden');
            } else if (engine.state === 'gameover') {
                finalScoreSub.innerText = `Điểm số đạt được: ${engine.score}`;
                gameoverOverlay.classList.remove('hidden');
            }
        }

        // Game Loop chính
        let lastTime = 0;
        const baseSpeed = 125; // ms per tick

        function gameLoop(timestamp) {
            if (!lastTime) lastTime = timestamp;
            const elapsed = timestamp - lastTime;

            // Tốc độ tăng dần theo Level
            const currentSpeed = Math.max(60, baseSpeed - (engine.level - 1) * 12);

            if (elapsed >= currentSpeed) {
                lastTime = timestamp;
                const result = engine.update();

                if (result.ateNormal) {
                    soundEngine.playEatNormal();
                    createParticles(engine.snake[0].x, engine.snake[0].y, '#39ff14');
                } else if (result.ateGolden) {
                    soundEngine.playEatGolden();
                    createParticles(engine.snake[0].x, engine.snake[0].y, '#ffcc00');
                }

                if (result.gameOver) {
                    soundEngine.playGameOver();
                    createParticles(engine.snake[0].x, engine.snake[0].y, '#ff3333');
                }

                updateUI();
            }

            render();
            updateParticles();
            requestAnimationFrame(gameLoop);
        }

        // --- Xử lý sự kiện bàn phím & cảm ứng ---
        window.addEventListener('keydown', e => {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'KeyW', 'KeyS', 'KeyA', 'KeyD', 'KeyR'].includes(e.code)) {
                e.preventDefault(); // Ngăn cuộn trang
            }

            if (e.code === 'ArrowUp' || e.code === 'KeyW') engine.setDirection(0, -1);
            if (e.code === 'ArrowDown' || e.code === 'KeyS') engine.setDirection(0, 1);
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') engine.setDirection(-1, 0);
            if (e.code === 'ArrowRight' || e.code === 'KeyD') engine.setDirection(1, 0);

            if (e.code === 'Space') {
                if (engine.state === 'playing' || engine.state === 'paused') {
                    engine.togglePause();
                    soundEngine.playPause();
                    updateUI();
                }
            }

            if (e.code === 'KeyR') {
                engine.reset();
                particles = [];
                updateUI();
            }
        });

        // Xử lý nút D-Pad trên mobile
        document.querySelectorAll('.dpad-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const dir = btn.getAttribute('data-dir');
                if (dir === 'up') engine.setDirection(0, -1);
                if (dir === 'down') engine.setDirection(0, 1);
                if (dir === 'left') engine.setDirection(-1, 0);
                if (dir === 'right') engine.setDirection(1, 0);
            });
        });

        // Nút bấm giao diện
        startBtn.addEventListener('click', () => {
            soundEngine.init();
            engine.state = 'playing';
            updateUI();
        });

        resumeBtn.addEventListener('click', () => {
            engine.togglePause();
            soundEngine.playPause();
            updateUI();
        });

        retryBtn.addEventListener('click', () => {
            engine.reset();
            particles = [];
            engine.state = 'playing';
            updateUI();
        });

        restartBtn.addEventListener('click', () => {
            engine.reset();
            particles = [];
            updateUI();
        });

        muteBtn.addEventListener('click', () => {
            const isMuted = soundEngine.toggleMute();
            muteBtn.innerText = isMuted ? 'AUDIO: OFF' : 'AUDIO: ON';
            muteBtn.style.borderColor = isMuted ? '#ff3333' : '#00f0ff';
            muteBtn.style.color = isMuted ? '#ff3333' : '#00f0ff';
        });

        // Khởi chạy ban đầu
        updateUI();
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
